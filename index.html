<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кисть и хокку</title>
<meta name="description" content="Иероглифы, порядок черт и каллиграфия на хокку Басё и его последователей">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кисть и хокку">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="KleeOne-400.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:"Golos Text";src:url(Golos.woff) format("woff");font-weight:400 700;font-display:swap}
@font-face{font-family:"Klee One";src:url(KleeOne-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Klee One";src:url(KleeOne-600.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Shippori Mincho";src:url(Shippori-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Shippori Mincho";src:url(Shippori-700.woff) format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"Yuji Syuku";src:url(YujiSyuku.woff) format("woff");font-weight:400;font-display:swap}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}

/* Макет: одноэкранное приложение. Колонка ~560px, путь из узлов-печатей, нижняя панель вкладок, уроки на весь экран. */
:root{
  --paper:#EDEFEA; --card:#F9FAF7; --sunk:#E3E6DF; --ink:#1C1E21; --ink2:#5A5F66; --line:#D2D6CD;
  --ghost:rgba(28,30,33,.13); --faint:rgba(28,30,33,.24); --good-line:#4E9A57; --shu-line:#D9573C;
  --ai:#2D4C85; --ai-deep:#1F3766; --ai-soft:#DCE3F0; --on-ai:#FFFFFF;
  --shu:#C6432A; --on-shu:#FFF7F2;
  --good:#3B7442; --good-soft:#DCEAD8; --bad:#A3344A; --bad-soft:#F3DEE2;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-kan:"Klee One", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-poem:"Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --f-brush:"Yuji Syuku", "Shippori Mincho", "Hiragino Mincho ProN", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141619; --card:#1D2024; --sunk:#262A2F; --ink:#ECE9E2; --ink2:#A2A6AC; --line:#33383E;
  --ghost:rgba(236,233,226,.14); --faint:rgba(236,233,226,.26); --good-line:#86C08B; --shu-line:#E2694F;
  --ai:#9DB5EA; --ai-deep:#6F8CC9; --ai-soft:#24304A; --on-ai:#11151C;
  --shu:#E2694F; --on-shu:#1A0F0B;
  --good:#86C08B; --good-soft:#1E3322; --bad:#E78C9E; --bad-soft:#3A2129; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141619; --card:#1D2024; --sunk:#262A2F; --ink:#ECE9E2; --ink2:#A2A6AC; --line:#33383E;
  --ghost:rgba(236,233,226,.14); --faint:rgba(236,233,226,.26); --good-line:#86C08B; --shu-line:#E2694F;
  --ai:#9DB5EA; --ai-deep:#6F8CC9; --ai-soft:#24304A; --on-ai:#11151C;
  --shu:#E2694F; --on-shu:#1A0F0B;
  --good:#86C08B; --good-soft:#1E3322; --bad:#E78C9E; --bad-soft:#3A2129; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.kan{font-family:var(--f-kan)}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:0 16px 24px}
h1,h2,h3{text-wrap:balance;margin:0}

/* top */
.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px;position:sticky;top:0;background:var(--paper);z-index:2}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font:600 18px var(--f-ui)}
.brand span{font:20px var(--f-brush);color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px}

/* tabs */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink2);font-size:12px;font-weight:500}
.tabs button .tk{font:22px/1.1 var(--f-kan)}
.tabs button[aria-selected="true"]{color:var(--ai)}

/* path */
.goal{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:4px}
.goal .t{flex:1;min-width:0}
.goal .t b{display:block;font-weight:600}
.goal .t small{color:var(--ink2)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--sunk);color:var(--ink);border-bottom:3px solid var(--line)}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.primary{background:var(--ai);color:var(--on-ai);border-bottom-color:var(--ai-deep)}
.btn.good{background:var(--good);color:var(--paper);border-bottom-color:color-mix(in srgb,var(--good) 70%,#000)}
.btn.bad{background:var(--bad);color:var(--paper);border-bottom-color:color-mix(in srgb,var(--bad) 70%,#000)}
.btn.ghost{background:transparent;border:1px solid var(--line);border-bottom-width:3px}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn.big{width:100%;padding:14px;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 10px}
.ustep{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.node{position:relative;width:78px;height:78px;border-radius:50%;border:0;background:var(--sunk);
  box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font:600 36px/1 var(--f-kan);color:var(--ink2)}
.node.open{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line),inset 0 0 0 3px var(--ai)}
.node.cur{background:var(--ai);color:var(--on-ai);box-shadow:0 5px 0 var(--ai-deep)}
.node.done{background:var(--ai-soft);color:var(--ai);box-shadow:0 5px 0 var(--line)}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node .seal{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:5px;background:var(--shu);color:var(--on-shu);
  font:13px/28px var(--f-brush);text-align:center;transform:rotate(-8deg)}
.node .lock{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.node .lock svg{width:12px;height:12px}
.cur-ring{position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--ai);opacity:.5;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.06);opacity:.15}}
.ulabel{text-align:center;font-size:13px;color:var(--ink2);max-width:180px}
.ulabel b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.ulabel .jp{font-family:var(--f-poem)}
.dash{width:2px;height:22px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.settings{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.settings .btn{font-size:13px;padding:8px 12px}

/* poems */
.sec-h{padding:8px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.poem{display:grid;grid-template-columns:auto 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.tate{writing-mode:vertical-rl;font:500 22px/1.6 var(--f-poem);letter-spacing:.08em;height:11.5em;min-width:0;padding-left:4px;border-left:1px solid var(--line);padding-right:2px}
.tate .kb{border:0;background:none;padding:0;font:inherit;color:var(--ai);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pm{min-width:0;display:flex;flex-direction:column;gap:6px}
.pm .who{font-weight:600}
.pm .who small{color:var(--ink2);font-weight:400}
.pm .kana{font:14px/1.6 var(--f-poem);color:var(--ink2)}
.pm .cyr{font-size:13px;color:var(--ink2);font-style:italic}
.pm .tr{font-size:15px}
.pm .note{font-size:13px;color:var(--ink2)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{padding:8px 12px;font-size:13px}

/* kanji grid */
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:4px 0 14px;font-size:14px}
.how b{font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-bottom:16px}
.ktile{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ktile .g{font:34px/1.15 var(--f-kan)}
.ktile .m{font-size:11px;color:var(--ink2);line-height:1.25;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.meter{display:flex;gap:2px;margin-top:3px}
.meter i{width:9px;height:4px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--good)}
.ktile.new .g{color:var(--ink2);opacity:.55}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet .x{float:right}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:10px;font-size:20px;color:var(--ink2)}

/* kanji card */
.kcard{display:flex;flex-direction:column;gap:14px}
.khead{display:flex;gap:16px;align-items:center}
.kbig{width:120px;height:120px;flex:none;display:grid;place-items:center;font:600 92px/1 var(--f-kan);background:var(--card);border:1px solid var(--line);border-radius:12px;
  background-image:linear-gradient(var(--ghost),var(--ghost)),linear-gradient(var(--ghost),var(--ghost));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.kmeta{min-width:0;display:flex;flex-direction:column;gap:4px}
.kmeta h3{font-size:20px;font-weight:600}
.rd{font-size:13px;color:var(--ink2)}
.rd .jp{font-family:var(--f-poem);color:var(--ink)}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.blk p{margin:4px 0 0}
.cal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:460px){.cal{grid-template-columns:1fr}}
.cal .blk.s .tag{color:var(--ai)}
.cal .blk.k{border-color:color-mix(in srgb,var(--shu) 45%,var(--line))}
.cal .blk.k .tag{color:var(--shu)}
.parts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pchip{font:24px/1 var(--f-kan);padding:6px 9px;border-radius:9px;background:var(--sunk)}
.plus{color:var(--ink2)}
.confs{display:flex;gap:6px}
.confs span{font:24px/1 var(--f-kan);padding:6px 9px;border-radius:9px;border:1px dashed var(--line)}

/* lesson */
.lesson{position:fixed;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lwrap{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.lbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.prog{flex:1;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--good);border-radius:7px;transition:width .35s ease}
.combo{font-size:13px;font-weight:700;color:var(--shu);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.lbody{flex:1;overflow-y:auto;padding:8px 16px 16px}
.lfoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.lfoot.good{background:var(--good-soft);border-color:transparent}
.lfoot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .fg{font:600 40px/1 var(--f-kan);flex:none}
.fb h4{margin:0;font-size:17px}
.lfoot.good h4{color:var(--good)}
.lfoot.bad h4{color:var(--bad)}
.fb p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.q{font:600 19px/1.35 var(--f-ui);margin:6px 0 14px}
.qbig{font:600 104px/1 var(--f-kan);text-align:center;margin:8px 0 18px}
.quote{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.opts{display:grid;gap:10px}
.opts.g4{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:14px;text-align:left;font-size:15px;display:flex;gap:10px;align-items:center;min-width:0}
.opt .n{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--ink2)}
.opt.gl{justify-content:center;font:600 50px/1.1 var(--f-kan);padding:16px 8px}
.opt.gl .n{position:absolute;margin:-44px 0 0 -80px;display:none}
.opt[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.poemline{font:500 24px/1.8 var(--f-poem);text-align:center;margin:4px 0 6px;letter-spacing:.05em}
.blank{display:inline-block;min-width:1.2em;border-bottom:3px solid var(--ai);color:var(--ai)}
.sub{text-align:center;color:var(--ink2);font-size:14px;margin-bottom:16px}
.ans{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:16px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:12px;padding:8px 12px;font:500 22px/1.2 var(--f-poem)}
.tile.k{font:600 30px/1.1 var(--f-kan);min-width:56px}
.tile.used{visibility:hidden}
.tile[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft)}
.trace{display:flex;flex-direction:column;align-items:center;gap:12px}
.tbox{position:relative;border-radius:10px;border:1px solid var(--line);background:var(--card);touch-action:none;max-width:100%}
.tbox canvas{position:absolute;inset:0}
.tbox .grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--ghost),var(--ghost)),linear-gradient(var(--ghost),var(--ghost)),
  linear-gradient(45deg,transparent calc(50% - .5px),var(--ghost) 50%,transparent calc(50% + .5px)),
  linear-gradient(-45deg,transparent calc(50% - .5px),var(--ghost) 50%,transparent calc(50% + .5px));
  background-size:100% 1px,1px 100%,100% 100%,100% 100%;background-position:center;background-repeat:no-repeat;opacity:.7}
.tinfo{font-size:13px;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums}
.learn-tag{display:inline-block;background:var(--shu);color:var(--on-shu);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-bottom:10px}

/* end */
.end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:24px}
.bigseal{width:120px;height:120px;border-radius:14px;background:var(--shu);color:var(--on-shu);display:grid;place-items:center;font:72px/1 var(--f-brush);transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(1.8) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat small{color:var(--ink2);font-size:12px}
.end .kl{font:600 30px var(--f-kan);letter-spacing:.15em}
.empty{color:var(--ink2);text-align:center;padding:30px 0}

/* stroke order & calligraphy visuals */
.gsvg{width:100%;height:100%;display:block;overflow:visible}
.pwrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.kbig.player{width:132px;height:132px;padding:6px}
.pctl{display:flex;gap:6px}
.pbtn{width:40px;height:34px;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--card);font-size:16px;line-height:1}
.pcap{font-size:12px;color:var(--ink2);text-align:center;max-width:160px;min-height:2.6em}
.viz{display:flex;gap:10px;align-items:center;margin:8px 0 4px}
.viz .vg{width:92px;height:92px;flex:none;background:var(--paper);border-radius:10px;padding:5px}
.viz .vl{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;min-width:0}
.leg{display:flex;align-items:center;gap:6px}
.dash-ico{display:inline-block;width:18px;border-top:2px dashed var(--ai);flex:none}
.cfs{display:flex;gap:6px;flex-wrap:wrap}
.cf{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:56px}
.cfg{width:44px;height:44px;border:1px dashed var(--line);border-radius:8px;padding:3px}
.cf small{font-size:10px;line-height:1.15;text-align:center;color:var(--ink2)}
.tbox .tghost{position:absolute;inset:0;padding:0;pointer-events:none}
.hdot{animation:hp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hp{50%{transform:scale(1.5);opacity:.55}}
.qsvg{width:150px;height:150px;margin:4px auto 10px}
.demo{width:100%;max-width:300px}
.demo summary{cursor:pointer;color:var(--ai);font-weight:600;font-size:14px;text-align:center;list-style:none;padding:6px}
.demo summary::-webkit-details-marker{display:none}
.demo[open] summary{margin-bottom:6px}
.tinfo a{color:var(--ai)}
.bk{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);resize:vertical}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" id="tab-path" aria-selected="true"><span class="tk">道</span>Путь</button>
    <button role="tab" id="tab-poems" aria-selected="false"><span class="tk">句</span>Хокку</button>
    <button role="tab" id="tab-kanji" aria-selected="false"><span class="tk">字</span>Знаки</button>
  </nav>
</div>

<script>
// ===== Данные: ключи, иероглифы, хокку =====

 '㇂':'наклонная с крючком','㇛':'двойной излом','㇜':'зигзаг','㇋':'зигзаг','㇉':'двойной излом с крючком','㇙':'вертикаль с подъёмом'};

</script>
<script>
(function(){
'use strict';
const ALL=[...RAD.map(x=>({...x,t:'rad'})),...KJ.map(x=>({...x,t:'kan'}))];
const M={}; ALL.forEach(it=>M[it.g]=it);
UNITS.forEach((u,i)=>{u.idx=i; if(u.lines) u.jp=u.lines.join(''); u.items.forEach(g=>{M[g].unit=u;});});

// ---------- state ----------
const KEY='kisti-hokku-v1';
function def(){return {srs:{},xp:0,streak:0,last:null,done:{},unlockAll:false,goal:30,today:null,todayXp:0};}
let S=def();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(def(),s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const dayStr=d=>{const x=d||new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();};
function rollDay(){const t=dayStr(); if(S.today!==t){S.today=t;S.todayXp=0;}
  if(S.last){const y=new Date();y.setDate(y.getDate()-1); if(S.last!==t&&S.last!==dayStr(y)) S.streak=0;}}
rollDay();

// ---------- SRS (упрощённый SM-2 с короткими шагами) ----------
function grade(g,ok){const now=Date.now();const c=S.srs[g]||{ef:2.5,iv:0,n:0,l:0,due:now};
  if(ok){c.n++; c.iv=c.n===1?1:c.n===2?3:Math.round(Math.max(1,c.iv)*c.ef); c.ef=Math.min(3,c.ef+0.05);}
  else{c.l++; c.n=0; c.iv=0; c.ef=Math.max(1.3,c.ef-0.2);}
  c.due=now+(c.iv?c.iv*864e5:10*6e4); S.srs[g]=c;}
const known=g=>!!S.srs[g];
const dueList=()=>ALL.filter(it=>S.srs[it.g]&&S.srs[it.g].due<=Date.now());
const level=g=>{const c=S.srs[g]; if(!c) return 0; return Math.min(5,1+Math.floor(Math.log2(1+c.iv)));};

// ---------- helpers ----------
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs) for(const k in attrs){const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(k==='html') e.innerHTML=v; else e.setAttribute(k,v===true?'':v);}
  for(const k of kids.flat(9)){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k)));}
  return e;}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const mask=(t,g)=>t.split(g).join('◯');
const isUnlocked=u=>S.unlockAll||u.idx===0||!!S.done[u.id]||!!S.done[UNITS[u.idx-1].id];
const ico={
  flame:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.6 2.3 3.8 3.9 3.8 7.7A3.8 3.8 0 0 1 8 13a3.8 3.8 0 0 1-3.8-3.8c0-1.6.8-2.6 1.6-3.4.1 1.2.7 2 1.4 2.3C6.7 6 7.3 3.7 8 1.5z" fill="var(--shu)"/></svg>',
  brush:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.5 1.5l3 3-6 6-3-3z" fill="var(--ai)"/><path d="M4.5 8.5l3 3c-.5 2-2.5 3-5.5 3 .3-2.5 1-4.5 2.5-6z" fill="var(--ink)"/></svg>',
  lock:'<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="var(--ink2)"/><path d="M4 5V3.5a2 2 0 0 1 4 0V5" stroke="var(--ink2)" stroke-width="1.4" fill="none"/></svg>'
};
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

// ---------- tabs ----------
let tab='path';
['path','poems','kanji'].forEach(t=>$('#tab-'+t).addEventListener('click',()=>{tab=t;render();}));
function render(){
  ['path','poems','kanji'].forEach(t=>$('#tab-'+t).setAttribute('aria-selected',String(t===tab)));
  const v=$('#view'); v.innerHTML=''; v.scrollTop=0;
  v.append(topBar());
  if(tab==='path') v.append(viewPath()); else if(tab==='poems') v.append(viewPoems()); else v.append(viewKanji());
}
function topBar(){
  return h('div',{class:'top'},
    h('div',{class:'brand'},h('b',null,'Кисть и хокку'),h('span',null,'筆と俳句')),
    h('span',{class:'chip',title:'Дней подряд',html:ico.flame+' '+S.streak}),
    h('span',{class:'chip',title:'Очки опыта',html:ico.brush+' '+S.xp}));
}

// ---------- path ----------
function ring(p){const r=18,c=2*Math.PI*r;
  return h('div',{html:`<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--shu)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" transform="rotate(-90 23 23)"/></svg>`});}
function viewPath(){
  const f=document.createDocumentFragment();
  const due=dueList();
  f.append(h('div',{class:'goal'},ring(S.todayXp/S.goal),
    h('div',{class:'t'},h('b',null,'Цель дня: ',S.todayXp,' / ',S.goal,' очков'),
      h('small',null, due.length? 'К повторению: '+due.length+' '+plural(due.length,'знак','знака','знаков') : (Object.keys(S.srs).length?'Повторять пока нечего — учите новое':'Начните с ключей: из них собраны все знаки'))),
    due.length? h('button',{class:'btn primary',onclick:startReview},'Повторить'):null));
  const p=h('div',{class:'path'});
  const offs=[0,40,60,40,0,-40,-60,-40];
  let curFound=false;
  UNITS.forEach((u,i)=>{
    const open=isUnlocked(u), done=!!S.done[u.id];
    const cur=open&&!done&&!curFound; if(cur) curFound=true;
    const node=h('button',{class:'node '+(cur?'cur':done?'done':open?'open':''),'aria-label':(u.author?u.author+': ':'')+u.title+(open?'':' — закрыто'),onclick:()=>openUnit(u)},
      u.node, cur?h('span',{class:'cur-ring'}):null,
      done?h('span',{class:'seal'},u.node):null,
      !open?h('span',{class:'lock',html:ico.lock}):null);
    if(i) p.append(h('div',{class:'dash',style:`transform:translateX(${(offs[i%8]+offs[(i-1)%8])/2}px)`}));
    p.append(h('div',{class:'ustep',style:`transform:translateX(${offs[i%8]}px)`},node,
      h('div',{class:'ulabel'},h('b',null,u.author?u.author+' · '+u.title:u.title), u.lines?h('span',{class:'jp'},u.lines[0]):u.sub)));
  });
  f.append(p);
  let armed=false;
  const reset=h('button',{class:'btn ghost',onclick:e=>{ if(!armed){armed=true;e.target.textContent='Точно стереть всё? Нажмите ещё раз';return;} S=def();save();render();}},'Сбросить прогресс');
  f.append(h('div',{class:'settings'},
    h('button',{class:'btn ghost',onclick:()=>{S.unlockAll=!S.unlockAll;save();render();}},S.unlockAll?'Вернуть порядок уроков':'Открыть все уроки'),
    h('button',{class:'btn ghost',onclick:openBackup},'Резервная копия'),
    reset));
  return f;
}
function openBackup(){
  const code=JSON.stringify(S);
  const out=h('textarea',{id:'bk-out',class:'bk',readonly:true,rows:4},code);
  const inp=h('textarea',{id:'bk-in',class:'bk',rows:4,placeholder:'Вставьте сюда сохранённый код'});
  const st=h('p',{class:'tinfo',role:'status'});
  const copy=h('button',{class:'btn primary',onclick:async()=>{try{await navigator.clipboard.writeText(code);st.textContent='Код скопирован. Сохраните его в Заметках.';}catch(e){out.focus();out.select();st.textContent='Выделено: скопируйте вручную.';}}},'Скопировать код');
  const restore=h('button',{class:'btn ghost',onclick:()=>{try{const v=JSON.parse(inp.value.trim());if(!v||typeof v!=='object'||!v.srs)throw 0;S=Object.assign(def(),v);save();closeSheet();render();}
    catch(e){st.textContent='Код не распознан. Скопируйте его целиком, от { до }.';}}},'Восстановить');
  sheet(h('div',null,h('h2',{style:'margin:2px 0 8px'},'Резервная копия'),
    h('p',{class:'tinfo',style:'text-align:left'},'Прогресс хранится только на этом устройстве. Скопируйте код и сохраните его, например в Заметках. Чтобы перенести прогресс, вставьте код ниже.'),
    out,h('div',{class:'row',style:'margin:8px 0 16px'},copy),inp,h('div',{class:'row',style:'margin-top:8px'},restore),st));
}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}

function openUnit(u){
  const open=isUnlocked(u);
  const body=h('div');
  body.append(h('div',{class:'tag'},u.author?(u.author+' · '+u.year):'Основы'), h('h2',{style:'margin:2px 0 12px'},u.title));
  if(u.lines) body.append(poemCard(u,false));
  else body.append(h('p',{class:'how',style:'margin-top:0'},'Ключи — повторяющиеся части знаков. Именно их каллиграф сокращает в первую очередь: они предсказуемы, и глаз узнаёт их по силуэту. Сохранять нужно то, что отличает знак от соседей.'));
  body.append(h('div',{class:'sec-h'},'Знаки урока'));
  body.append(h('div',{class:'kgrid'},u.items.map(g=>ktile(M[g]))));
  body.append(open? h('button',{class:'btn primary big',onclick:()=>{closeSheet();startLesson(u);}},S.done[u.id]?'Пройти ещё раз':'Начать урок')
    : h('p',{class:'empty'},'Урок откроется после предыдущего. Или нажмите «Открыть все уроки» внизу пути.'));
  sheet(body);
}

// ---------- poems ----------
function poemCard(u,withBtn){
  const tate=h('div',{class:'tate',lang:'ja'});
  u.lines.forEach((ln,li)=>{
    [...ln].forEach(ch=>{ if(M[ch]&&M[ch].t==='kan') tate.append(h('button',{class:'kb',onclick:()=>openKanji(ch),'aria-label':'Знак '+ch+': '+M[ch].m},ch)); else tate.append(ch);});
    if(li<u.lines.length-1) tate.append(h('br'));
  });
  return h('div',{class:'poem'},tate,
    h('div',{class:'pm'},
      h('div',{class:'who'},u.author,' ',h('small',null,u.year)),
      h('div',{class:'kana',lang:'ja'},u.kana.join(' / ')),
      h('div',{class:'cyr'},u.cyr),
      h('div',{class:'tr'},u.tr),
      h('div',{class:'note'},u.note),
      h('div',{class:'row'},
        h('button',{class:'btn ghost',onclick:()=>speak(u.kana.join('、'))},'Слушать'),
        withBtn&&isUnlocked(u)?h('button',{class:'btn primary',onclick:()=>startLesson(u)},S.done[u.id]?'Повторить урок':'Урок'):null)));
}
function viewPoems(){
  const f=document.createDocumentFragment();
  f.append(h('p',{class:'how'},'Хокку записаны вертикально, как в оригинале: читаются сверху вниз, столбцы справа налево. Подчёркнутые знаки можно нажать. Переводы — дословные, чтобы видеть, какой иероглиф что значит.'));
  UNITS.filter(u=>u.lines).forEach(u=>f.append(poemCard(u,true)));
  return f;
}

// ---------- kanji ----------
function ktile(it){
  const lv=level(it.g);
  return h('button',{class:'ktile'+(known(it.g)?'':' new'),onclick:()=>openKanji(it.g),'aria-label':it.g+': '+it.m},
    h('span',{class:'g'},it.g),h('span',{class:'m'},it.m),
    h('span',{class:'meter','aria-hidden':'true'},[1,2,3,4,5].map(i=>h('i',{class:i<=lv?'on':''}))));
}
function viewKanji(){
  const f=document.createDocumentFragment();
  f.append(h('div',{class:'how'},
    h('b',null,'Как читать заметки каллиграфа. '),
    'Каждый знак проходит путь от кайсё (уставное письмо) к гёсё (полускоропись) и сосё (скоропись). ',
    h('b',{style:'color:var(--ai)'},'Сокращается'),' то, что повторяется и предсказуемо: ключи, точки, внутренние черты. ',
    h('b',{style:'color:var(--shu)'},'Не трогают'),' то, что отличает знак от похожего: число черт внутри рамки, длину горизонталей, точку, выход вертикали.'));
  UNITS.forEach(u=>{
    f.append(h('div',{class:'sec-h'},u.author?u.author+' · '+u.title:u.title));
    f.append(h('div',{class:'kgrid'},u.items.map(g=>ktile(M[g]))));
  });
  f.append(h('p',{class:'tinfo'},'Этимологии — по «Шовэнь цзецзы» и словарям Сиракавы Сидзуки; для ряда знаков есть конкурирующие версии. Порядок и форма черт — ',h('a',{href:'https://kanjivg.tagaini.net/',target:'_blank',rel:'noopener'},'KanjiVG'),' © Ulrich Apel, лицензия CC BY-SA 3.0.'));
  return f;
}
function kanjiCard(it,isLearn){
  const rd=[];
  if(it.on) rd.push(h('div',{class:'rd'},'он: ',h('span',{class:'jp'},it.on),' (',it.onr,')'));
  if(it.kun) rd.push(h('div',{class:'rd'},it.t==='rad'?'название: ':'кун: ',h('span',{class:'jp'},it.kun),it.kunr?' ('+it.kunr+')':''));
  const pl=orderPlayer(it.g); const cv=calViz(it);
  const c=h('div',{class:'kcard'},
    h('div',{class:'khead'},pl.node,
      h('div',{class:'kmeta'},h('span',{class:'tag'},(it.t==='rad'?'ключ · ':'')+it.s+' '+plural(it.s,'черта','черты','черт')),h('h3',null,it.m),rd,
        h('div',null,h('button',{class:'btn ghost',style:'padding:6px 10px;font-size:13px;margin-top:4px',onclick:()=>speak((it.kun||it.on).split(/[・(（ —]/)[0])},'Произнести')))),
    h('div',{class:'blk'},h('span',{class:'tag'},'Почему он такой'),h('p',null,it.et)),
    it.parts?h('div',{class:'parts'},it.parts.map((p,i)=>[i?h('span',{class:'plus'},'+'):null,h('span',{class:'pchip'},p)]),h('span',{class:'plus'},'='),h('span',{class:'pchip'},it.g)):null,
    h('div',{class:'cal'},
      h('div',{class:'blk s'},h('span',{class:'tag'},'Можно сокращать'),cv?cv.sim:null,h('p',null,it.sim)),
      h('div',{class:'blk k'},h('span',{class:'tag'},'Нельзя трогать'),cv?cv.keep:null,h('p',null,it.keep)))
  );
  if(!isLearn&&it.unit&&it.unit.lines) c.append(h('div',{class:'rd'},'Из урока: ',it.unit.author,' — ',h('span',{class:'jp'},it.unit.lines.join(' '))));
  return c;
}
function openKanji(g){
  const it=M[g];
  sheet(h('div',null,kanjiCard(it,false),
    h('div',{class:'row',style:'margin-top:14px'},h('button',{class:'btn primary',onclick:()=>{closeSheet();runSession([{t:'trace',it,free:true}],{free:true});}},'Прописать кистью'))));
}

// ---------- sheet ----------
let sheetEl=null;
function sheet(content){closeSheet();
  sheetEl=h('div',{class:'scrim',onclick:e=>{if(e.target===sheetEl)closeSheet();}},
    h('div',{class:'sheet',role:'dialog','aria-modal':'true'},h('div',{class:'grab'}),h('button',{class:'icon-btn x','aria-label':'Закрыть',onclick:closeSheet},'✕'),content));
  document.body.append(sheetEl); $('.x',sheetEl).focus();}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetEl)closeSheet();});

// ---------- lesson building ----------
function sameKind(it){return ALL.filter(x=>x.t===it.t&&x.g!==it.g);}
function glyphChoices(it,extra){const out=[it.g],seen=new Set(out);
  const add=g=>{if(out.length<4&&g&&!seen.has(g)){seen.add(g);out.push(g);}};
  shuffle(it.conf||[]).slice(0,2).forEach(add);
  shuffle(extra||[]).forEach(add);
  const u=it.unit?it.unit.items:[]; shuffle(u).forEach(add);
  shuffle(sameKind(it).map(x=>x.g)).forEach(add);
  return shuffle(out);}
function meaningChoices(it){const out=[it.m],seen=new Set(out);
  const pool=[...shuffle((it.unit?it.unit.items:[]).map(g=>M[g])),...shuffle(sameKind(it))];
  for(const x of pool){if(out.length>=4)break; if(x.g!==it.g&&!seen.has(x.m)){seen.add(x.m);out.push(x.m);}}
  return shuffle(out);}
function startLesson(u){
  const its=u.items.map(g=>M[g]);
  const q=[];
  its.forEach(it=>{ if(!known(it.g)) q.push({t:'learn',it}); q.push({t:'mcm',it}); });
  const mix=[];
  its.forEach(it=>{ mix.push({t:rnd(['mcg','etym','keep']),it}); if(it.parts&&it.t==='kan') mix.push({t:'build',it}); if(STK[it.g]&&STK[it.g].d.length>=3&&Math.random()<.6) mix.push({t:'order',it}); });
  if(u.jp){ const inPoem=shuffle([...new Set([...u.jp].filter(ch=>M[ch]&&M[ch].t==='kan'&&(u.items.includes(ch)||known(ch))))]);
    inPoem.slice(0,3).forEach(g=>mix.push({t:'gap',it:M[g],u})); }
  if(u.id==='rad') its.forEach(it=>mix.push({t:'keep',it}));
  q.push(...shuffle(mix));
  shuffle(its).slice(0,u.id==='rad'?2:2).forEach(it=>q.push({t:'trace',it}));
  if(u.chunks) q.push({t:'asm',u});
  runSession(q,{unit:u});
}
function startReview(){
  const due=shuffle(dueList()).slice(0,10);
  const items=due.length?due:shuffle(ALL.filter(x=>known(x.g))).slice(0,8);
  if(!items.length) return;
  const q=items.map(it=>{const opts=['mcm','mcg','etym','keep']; if(STK[it.g]&&STK[it.g].d.length>=3) opts.push('order'); if(it.unit&&it.unit.jp&&it.unit.jp.includes(it.g)) opts.push('gap','gap');
    const t=rnd(opts); return {t,it,u:it.unit};});
  q.push({t:'trace',it:rnd(items)});
  runSession(q,{review:true});
}

// ---------- session runner ----------
let keyHandler=null;
function runSession(queue,meta){
  closeSheet();
  const L={q:[...queue],done:0,res:{},right:0,wrong:0,combo:0,best:0};
  const fill=h('i'), combo=h('span',{class:'combo'});
  const body=h('div',{class:'lbody'}), foot=h('div',{class:'lfoot'});
  const root=h('div',{class:'lesson',role:'dialog','aria-modal':'true','aria-label':'Урок'},
    h('div',{class:'lwrap'},
      h('div',{class:'lbar'},h('button',{class:'icon-btn','aria-label':'Выйти из урока',onclick:exit},'✕'),h('div',{class:'prog'},fill),combo),
      body,foot));
  document.body.append(root);
  keyHandler=e=>{
    if(e.key==='Escape'){exit();return;}
    if(/^[1-6]$/.test(e.key)){const o=body.querySelectorAll('.opt');const b=o[+e.key-1]; if(b&&!b.disabled) b.click();}
    if(e.key==='Enter'){const b=foot.querySelector('.btn.main'); if(b&&!b.disabled){e.preventDefault();b.click();}}
  };
  document.addEventListener('keydown',keyHandler);
  function exit(){document.removeEventListener('keydown',keyHandler);root.remove();render();}
  function upd(){fill.style.width=(100*L.done/(L.done+L.q.length))+'%'; combo.textContent=L.combo>=3?L.combo+' подряд':'';}
  function next(){upd(); if(!L.q.length) return finish(); show(L.q.shift());}
  function show(ex){
    body.innerHTML=''; foot.innerHTML=''; foot.className='lfoot'; body.scrollTop=0;
    let btn;
    const E=build(ex,()=>{btn.disabled=!E.ready();});
    body.append(E.node);
    if(E.learn){ btn=h('button',{class:'btn primary big main',onclick:()=>{L.done++;next();}},'Понятно'); foot.append(btn); return; }
    const skip=E.skippable?h('button',{class:'btn ghost',onclick:()=>{L.done++;next();}},'Пропустить'):null;
    btn=h('button',{class:'btn primary big main',disabled:true,onclick:async()=>{
      btn.disabled=true; const r=await E.check(); feedback(ex,r);}},'Проверить');
    foot.append(skip?h('div',{class:'row',style:'flex-wrap:nowrap'},skip,btn):btn);
  }
  function feedback(ex,r){
    const it=ex.it;
    if(ex.t!=='trace'){
      if(r.ok){L.right++;L.combo++;L.best=Math.max(L.best,L.combo); if(it&&L.res[it.g]===undefined) L.res[it.g]=true;}

      setTimeout(setHint,1400);}

  fg.addEventListener('pointerup',up); fg.addEventListener('pointercancel',up);
  const clear=()=>{fx.clearRect(0,0,W,W);strokes=0;res=[];gp.forEach(e=>e.style.stroke='var(--ghost)');setHint();setInfo();onReady();};
  const gbtn=h('button',{class:'btn ghost',onclick:()=>{showGhost=!showGhost;ghost.style.visibility=showGhost?'visible':'hidden';setHint();gbtn.textContent=showGhost?'Скрыть образец':'Показать образец';}},'Скрыть образец');
  const pl=orderPlayer(it.g);
  const demo=h('details',{class:'demo'},h('summary',null,'Показать порядок черт'),pl.node);
  return {skippable:true,
    node:h('div',null,h('div',{class:'q'},'Пропишите «',it.m,'» по порядку черт'),
      h('div',{class:'trace'},box,info,h('div',{class:'row'},h('button',{class:'btn ghost',onclick:clear},'Стереть'),gbtn),demo,
        h('div',{class:'tinfo'},'Красная точка — где начинается следующая черта, штрих — куда вести кисть. Зелёным отмечаются верные черты.'))),
    ready:()=>strokes>0,
    check:async()=>{
      const ref=refCanvas(it.g,W);
      const N=64,G=maskOf(ref,N),U=maskOf(fg,N),Gd=dilate(G,N,3),Ud=dilate(U,N,2);
      let g=0,gc=0,u=0,uc=0;for(let i=0;i<N*N;i++){if(G[i]){g++;if(Ud[i])gc++;}if(U[i]){u++;if(Gd[i])uc++;}}
      const cov=g?gc/g:0,prec=u?uc/u:0,form=cov+prec?2*cov*prec/(cov+prec):0;
      const good=res.filter(Boolean).length, ordR=D?good/Math.max(n,strokes):1;
      ghost.style.visibility='visible';
      const ok=form>=0.5&&ordR>=0.6;
      const wrongN=[];for(let i=0;i<n;i++) if(res[i]!==true) wrongN.push(i+1);
      return {ok,retry:true,title:ok?'Форма '+Math.round(form*100)+'%, порядок '+good+'/'+n:'Форма '+Math.round(form*100)+'%, порядок '+good+'/'+n,
        msg:(ok?'Хорошо. ':'')+(wrongN.length&&D?'Проверьте черты: '+wrongN.slice(0,6).join(', ')+'. ':'Порядок верный. ')+(strokes!==n?'Штрихов '+strokes+', нужно '+n+'.':'')};
    }};
}
function exOrder(it,onReady){
  const D=STK[it.g],n=D.d.length,k=1+Math.floor(Math.random()*n);
  const svg=glyphSvg(it.g,{color:i=>i===k?'var(--shu)':'var(--ink)',width:i=>i===k?5.5:4});
  const e=D.e[k-1]; svg.append(sv('circle',{cx:e[0],cy:e[1],r:3},{fill:'var(--shu)'}));
  const cand=new Set([k]); const near=shuffle([k-2,k-1,k+1,k+2,k-3,k+3,1,n].filter(x=>x>=1&&x<=n));
  near.forEach(x=>{if(cand.size<4)cand.add(x);});
  const ch=[...cand].sort((a,b)=>a-b).map(String);
  const E=mc(it,[h('div',{class:'q'},'Какой по счёту пишется красная черта?'),h('div',{class:'qsvg',lang:'ja'},svg),h('div',{class:'sub'},it.g+' — '+it.m+', всего '+n+' '+plural(n,'черта','черты','черт'))],ch,String(k),false,onReady);
  const chk=E.check; E.check=()=>{const r=chk();r.right=k+'-я — '+stName(it.g,k-1);r.msg='Черта '+k+' — '+stName(it.g,k-1)+'.';return r;};
  return E;
}

render();
})();
